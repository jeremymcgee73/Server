{{- if eq .Values.database.mode "embedded" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "takserver.fullname" . }}-postgres
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    {{- include "takserver.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "takserver.fullname" . }}-postgres
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "takserver.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "takserver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "takserver.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.database.embedded.image.registry }}/{{ .Values.database.embedded.image.repository }}:{{ .Values.database.embedded.image.tag }}"
          imagePullPolicy: {{ .Values.database.embedded.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "takserver.databaseSecretName" . }}
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "takserver.databaseSecretName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "takserver.databaseSecretName" . }}
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.database.embedded.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- with .Values.database.embedded.persistence.storageClass }}
        storageClassName: {{ . | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ $.Values.database.embedded.persistence.size }}
{{- else }}
      volumes:
        - name: postgres-data
          emptyDir: {}
{{- end }}
{{- end }}
