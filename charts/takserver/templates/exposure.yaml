{{- if eq .Values.exposure.mode "ingress" }}
{{- $ingressAnnotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.exposure.ingress.annotations }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "takserver.fullname" . }}
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
{{- with $ingressAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
{{- with .Values.exposure.ingress.className }}
  ingressClassName: {{ . | quote }}
{{- end }}
{{- with .Values.exposure.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
{{- end }}
  rules:
    - host: {{ .Values.exposure.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.exposure.ingress.path }}
            pathType: {{ .Values.exposure.ingress.pathType }}
            backend:
              service:
                name: {{ include "takserver.fullname" . }}-api
                port:
{{- if kindIs "string" .Values.exposure.ingress.servicePort }}
                  name: {{ .Values.exposure.ingress.servicePort }}
{{- else }}
                  number: {{ .Values.exposure.ingress.servicePort }}
{{- end }}
{{- end }}
{{- if eq .Values.exposure.mode "gateway" }}
{{- if .Values.exposure.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ required "exposure.gateway.name is required when exposure.gateway.create is true" .Values.exposure.gateway.name }}
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
{{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
{{- with .Values.exposure.gateway.className }}
  gatewayClassName: {{ . | quote }}
{{- else }}
  gatewayClassName: {{ required "exposure.gateway.className is required when exposure.gateway.create is true" .Values.exposure.gateway.className | quote }}
{{- end }}
  listeners:
    - name: {{ .Values.exposure.gateway.listenerName }}
      protocol: HTTP
      port: {{ .Values.exposure.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "takserver.fullname" . }}
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
{{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  parentRefs:
    - name: {{ required "exposure.gateway.name is required when exposure.mode is gateway" .Values.exposure.gateway.name }}
      sectionName: {{ .Values.exposure.gateway.listenerName }}
{{- with .Values.exposure.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.exposure.gateway.path }}
      backendRefs:
        - name: {{ include "takserver.fullname" . }}-api
          port: {{ .Values.exposure.gateway.servicePort }}
{{- end }}
