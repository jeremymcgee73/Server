{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "takserver.fullname" . }}
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
{{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  parentRefs:
    - name: {{ required "gateway.name is required when gateway.enabled is true" .Values.gateway.name }}
      sectionName: {{ .Values.gateway.listenerName }}
{{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.path }}
      backendRefs:
        - name: {{ include "takserver.fullname" . }}-api
          port: {{ .Values.gateway.servicePort }}
{{- end }}
