{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "takserver.fullname" . }}
  labels:
    {{- include "takserver.labels" . | nindent 4 }}
{{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "takserver.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
{{- if has "Ingress" .Values.networkPolicy.policyTypes }}
{{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
{{- else }}
  ingress: []
{{- end }}
{{- end }}
{{- if has "Egress" .Values.networkPolicy.policyTypes }}
{{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
{{- else }}
  egress: []
{{- end }}
{{- end }}
{{- end }}
